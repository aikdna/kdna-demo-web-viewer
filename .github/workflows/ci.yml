name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        node: ['22.23.1', '24.18.0']
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/host/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix host ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run public:check
      - run: npm run audit:production
      - run: npm run build

  browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.1'
          check-latest: false
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/host/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix host ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chrome webkit
      - run: npm run build
      - name: Exercise explicit Read, cancellation, and release in both browsers
        run: npm run test:e2e
